spring.application.name=billingsoftware

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/billing_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
server.servlet.context-path=/api/v1.0

jwt.secret.key=${JWT_SECRET_KEY:change-me-in-production}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
app.upload-url-prefix=${UPLOAD_URL_PREFIX:/api/v1.0/uploads}
